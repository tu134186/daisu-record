name: Build CarIdle IPA
on:
  workflow_dispatch:
  push:
    branches: [fix/live-activity-v2.3.10]
    paths:
      - app.zip
      - scripts/**
      - .github/workflows/build.yml
permissions:
  contents: write
concurrency:
  group: caridle-delivery
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract and repair source
        shell: bash
        run: |
          set -euo pipefail
          if test -f project.yml; then
            mkdir -p src
            rsync -a --exclude=src --exclude=.git --exclude=build --exclude=_delivery ./ src/
          else
            unzip -tq app.zip
            mkdir -p src
            unzip -q app.zip -d src
          fi
          test -f src/CarIdleWidget/IdleWidget.swift
          if ! grep -q 'MARKETING_VERSION: "2.3.13"' src/project.yml; then
            PROJECT_DIR=src python3 scripts/signing48.py
          fi
          mkdir -p src/.github/workflows src/scripts _delivery
          cp .github/workflows/build.yml src/.github/workflows/build.yml
          cp -R scripts/. src/scripts/
          mkdir -p src/docs
          cp docs/live-activity-signing-evidence.md src/docs/
      - name: Check source and package exact source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib,zipfile,re
          root=Path('src')
          for p in root.rglob('*.plist'):plistlib.loads(p.read_bytes())
          project=(root/'project.yml').read_text()
          assert project.count('MARKETING_VERSION: "2.3.13"')==2
          assert project.count('CURRENT_PROJECT_VERSION: "48"')==2
          text=(root/'CarIdleWidget/IdleWidget.swift').read_text()
          assert 'pause.fill' not in text and 'pauseButton' not in text
          compact=text.split('} compactTrailing: {',1)[1].split('} minimal:',1)[0]
          assert '.infinity' not in compact and 'CountdownText(' in compact
          assert '.hidden()' not in text and '.overlay(' not in text
          assert 'Text(timerInterval:' in text
          assert (root/'Shared/IdleActivityAttributes.swift').is_file()
          assert project.count('      - Shared')==2
          assert 'com.trollbox.caridle.widget' in project
          archive=Path('_delivery/2.3.13-CarIdle-Build48-source.zip')
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and not any(x in p.relative_to(root).parts for x in ('build','.git','Payload')):z.write(p,p.relative_to(root))
          with zipfile.ZipFile(archive) as z:assert z.testzip() is None
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app and Live Activity extension
        working-directory: src
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project CarIdle.xcodeproj -scheme CarIdle -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee ../build-output.log
      - name: Verify bundle versions and package IPA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib,shutil,subprocess,zipfile,hashlib
          app=Path('src/build/Build/Products/Release-iphoneos/CarIdle.app')
          assert app.is_dir()
          verification=[]
          widgets=list((app/'PlugIns').glob('*.appex'));assert len(widgets)==1,widgets
          for bundle in [app,*widgets]:
              d=plistlib.loads((bundle/'Info.plist').read_bytes())
              assert d['CFBundleShortVersionString']=='2.3.13',d
              assert d['CFBundleVersion']=='48',d
              executable=bundle/d['CFBundleExecutable']
              assert executable.is_file()
              assert tuple(map(int,d['MinimumOSVersion'].split('.'))) <= (16,5),d
              if bundle == app:
                  assert d['CFBundleIdentifier']=='com.trollbox.caridle'
                  assert d.get('NSSupportsLiveActivities') is True
              else:
                  assert d['CFBundleIdentifier']=='com.trollbox.caridle.widget'
                  assert d['NSExtension']['NSExtensionPointIdentifier']=='com.apple.widgetkit-extension'
                  symbols=subprocess.check_output(['strings',str(executable)],text=True)
                  assert 'pause.fill' not in symbols
              verification.append(str(bundle.name)+' '+d['CFBundleIdentifier']+' '+d['CFBundleShortVersionString']+' ('+d['CFBundleVersion']+') MinimumOS='+d['MinimumOSVersion'])
              verification.append(subprocess.check_output(['xcrun','vtool','-show-build',str(executable)],text=True))
          Path('_delivery/Build48-verification.txt').write_text('\n'.join(verification))
          payload=Path('_delivery/Payload');payload.mkdir()
          shutil.copytree(app,payload/'CarIdle.app')
          dest=Path('_delivery/Payload/CarIdle.app')
          for bundle in [*(dest/'PlugIns').glob('*.appex'),dest]:
              name='CarIdle' if bundle == dest else 'CarIdleWidget'
              entitlements=Path('src/Signing')/(name+'.entitlements')
              subprocess.run(['codesign','--force','--sign','-','--entitlements',str(entitlements),str(bundle)],check=True)
              signed=subprocess.check_output(['codesign','-d','--entitlements',':-',str(bundle)],stderr=subprocess.DEVNULL)
              ent=plistlib.loads(signed)
              info=plistlib.loads((bundle/'Info.plist').read_bytes())
              assert ent['application-identifier']=='TROLLTROLL.'+info['CFBundleIdentifier'],ent
              assert ent['com.apple.developer.team-identifier']=='TROLLTROLL',ent
              verification.append(name+' signed entitlements: '+str(ent))
          subprocess.run(['codesign','--verify','--strict','--deep',str(dest)],check=True)
          Path('_delivery/Build48-verification.txt').write_text('\n'.join(verification))
          subprocess.run(['zip','-qry','2.3.13-CarIdle-Build48.ipa','Payload'],cwd='_delivery',check=True)
          with zipfile.ZipFile('_delivery/2.3.13-CarIdle-Build48.ipa') as z:
              assert z.testzip() is None
              assert 'Payload/CarIdle.app/PlugIns/CarIdleWidget.appex/Info.plist' in z.namelist()
          shutil.rmtree(payload)
          files=sorted(Path('_delivery').iterdir())
          Path('_delivery/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CarIdle-2.3.13-Build48
          path: _delivery/*
          if-no-files-found: error
      - name: Publish downloadable files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.3.13-build48-${GITHUB_RUN_ID}" _delivery/* --target "$GITHUB_SHA" --title "CarIdle 2.3.13 Build 48" --notes "Explicit matching app and extension signing identities; post-sign entitlements and signature verification. Build47 timer layout retained. Device rendering validation pending. Run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}."
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CarIdle-Build-Logs
          path: build-output.log
          if-no-files-found: warn
