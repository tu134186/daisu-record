name: 编译怠速记录

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 1. 读取仓库
        uses: actions/checkout@v4

      - name: 2. 检查 app.zip
        shell: bash
        run: |
          set -e
          test -f app.zip || {
            echo "❌ 仓库根目录没有 app.zip"
            exit 1
          }

          unzip -tq app.zip >/dev/null
          echo "✅ app.zip 正常"

      - name: 3. 解压源码
        shell: bash
        run: |
          set -e

          rm -rf src
          mkdir -p src
          unzip -q app.zip -d src

          test -f src/project.yml || {
            echo "❌ app.zip 根目录没有 project.yml"
            exit 1
          }

          echo "✅ 源码解压完成"

      - name: 4. 安装 XcodeGen 和 ldid
        shell: bash
        run: |
          set -e

          brew install xcodegen
          brew install ldid

          xcodegen --version

          echo "✅ XcodeGen 和 ldid 安装完成"

      - name: 5. 生成 Xcode 工程
        working-directory: src
        shell: bash
        run: |
          set -e

          xcodegen generate

          test -d CarIdle.xcodeproj || {
            echo "❌ CarIdle.xcodeproj 生成失败"
            exit 1
          }

          echo "✅ Xcode 工程生成成功"

      - name: 6. 编译 iPhone Release
        working-directory: src
        shell: bash
        run: |
          set -o pipefail

          rm -rf build
          mkdir -p build/Release-iphoneos

          xcodebuild \
            -project CarIdle.xcodeproj \
            -target CarIdle \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee ../xcodebuild.log

      - name: 7. 写入 TrollStore 权限
        shell: bash
        run: |
          set -e

          APP="src/build/Release-iphoneos/CarIdle.app"
          WIDGET="$APP/PlugIns/CarIdleWidget.appex"

          if [ ! -d "$APP" ]; then
            echo "❌ 找不到 CarIdle.app"
            exit 1
          fi

          if [ ! -d "$WIDGET" ]; then
            echo "❌ 找不到 CarIdleWidget.appex"
            echo "当前 App 内容："
            find "$APP" -maxdepth 3 -print
            exit 1
          fi

          APP_EXE=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            "$APP/Info.plist"
          )

          WIDGET_EXE=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            "$WIDGET/Info.plist"
          )

          echo "=============================="
          echo "给 Widget 写入 App Group 权限"
          echo "=============================="

          ldid \
            -Ssrc/CarIdleWidget/CarIdleWidget.entitlements \
            "$WIDGET/$WIDGET_EXE"

          echo "=============================="
          echo "给主 App 写入 App Group 权限"
          echo "=============================="

          ldid \
            -Ssrc/CarIdle/CarIdle.entitlements \
            "$APP/$APP_EXE"

          echo "=============================="
          echo "Widget 最终权限"
          echo "=============================="

          ldid -e "$WIDGET/$WIDGET_EXE"

          echo "=============================="
          echo "主 App 最终权限"
          echo "=============================="

          ldid -e "$APP/$APP_EXE"

          echo "✅ TrollStore 权限写入完成"

      - name: 8. 打包 IPA
        shell: bash
        run: |
          set -e

          APP_PATH="src/build/Release-iphoneos/CarIdle.app"

          VERSION=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$APP_PATH/Info.plist"
          )

          BUILD=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleVersion' \
            "$APP_PATH/Info.plist"
          )

          echo "=============================="
          echo "怠速记录 V${VERSION}"
          echo "Build ${BUILD}"
          echo "=============================="

          rm -rf Payload
          rm -rf output

          mkdir -p Payload
          mkdir -p output

          cp -R "$APP_PATH" Payload/

          zip -qry \
            "output/怠速记录-V${VERSION}.ipa" \
            Payload

          cp \
            "output/怠速记录-V${VERSION}.ipa" \
            "output/怠速记录.ipa"

          echo "✅ IPA 打包完成"

          ls -lh output

      - name: 9. 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: 怠速记录-IPA
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 10. 编译失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 编译失败日志
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
