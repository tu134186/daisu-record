name: 编译怠速记录

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 1. 读取仓库
        uses: actions/checkout@v4

      - name: 2. 检查 app.zip
        shell: bash
        run: |
          set -e

          if [ ! -f "app.zip" ]; then
            echo "❌ 仓库根目录没有 app.zip"
            exit 1
          fi

          echo "✅ 找到 app.zip"
          unzip -tq app.zip >/dev/null

      - name: 3. 解压源码
        shell: bash
        run: |
          set -e

          rm -rf src
          mkdir -p src

          unzip -q app.zip -d src

          if [ ! -f "src/project.yml" ]; then
            echo "❌ app.zip 根目录没有 project.yml"
            find src -maxdepth 3 -type f | head -80
            exit 1
          fi

          echo "✅ 源码结构正常"

      - name: 4. 安装 XcodeGen
        shell: bash
        run: |
          set -e

          brew install xcodegen
          xcodegen --version

          echo "✅ XcodeGen 安装完成"

      - name: 5. 生成 Xcode 工程
        working-directory: src
        shell: bash
        run: |
          set -e

          xcodegen generate

          if [ ! -d "CarIdle.xcodeproj" ]; then
            echo "❌ Xcode 工程生成失败"
            exit 1
          fi

          echo "✅ Xcode 工程生成成功"

      - name: 6. 编译 iPhone Release
        working-directory: src
        shell: bash
        run: |
          set -o pipefail

          rm -rf build
          mkdir -p build/Release-iphoneos

          xcodebuild \
            -project CarIdle.xcodeproj \
            -target CarIdle \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee ../xcodebuild.log

      - name: 7. 检查 App 和 Widget
        shell: bash
        run: |
          set -e

          APP="src/build/Release-iphoneos/CarIdle.app"
          WIDGET="$APP/PlugIns/CarIdleWidget.appex"

          if [ ! -d "$APP" ]; then
            echo "❌ 没找到 CarIdle.app"
            exit 1
          fi

          echo "✅ 主 App 编译成功"

          if [ -d "$WIDGET" ]; then
            echo "✅ 找到中号小组件 CarIdleWidget.appex"
          else
            echo "❌ 没找到 CarIdleWidget.appex"
            find "$APP" -maxdepth 3 -print
            exit 1
          fi

      - name: 8. 打包 IPA
        shell: bash
        run: |
          set -e

          APP_PATH="src/build/Release-iphoneos/CarIdle.app"

          VERSION=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$APP_PATH/Info.plist"
          )

          BUILD=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleVersion' \
            "$APP_PATH/Info.plist"
          )

          echo "============================"
          echo "怠速记录 V${VERSION}"
          echo "Build ${BUILD}"
          echo "============================"

          rm -rf Payload
          rm -rf output

          mkdir -p Payload
          mkdir -p output

          cp -R "$APP_PATH" Payload/

          zip -qry \
            "output/怠速记录-V${VERSION}.ipa" \
            Payload

          cp \
            "output/怠速记录-V${VERSION}.ipa" \
            "output/怠速记录.ipa"

          echo "✅ IPA 打包完成"
          ls -lh output

      - name: 9. 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: 怠速记录-IPA
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 10. 上传编译失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 编译失败日志
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
