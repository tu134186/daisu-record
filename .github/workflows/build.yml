name: 编译怠速记录

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 1. 读取仓库
        uses: actions/checkout@v4

      - name: 2. 检查 app.zip
        run: |
          set -e
          test -f app.zip || {
            echo "❌ 根目录没有 app.zip"
            exit 1
          }

          unzip -tq app.zip >/dev/null
          echo "✅ app.zip 检查通过"

      - name: 3. 解压源码
        run: |
          set -e

          rm -rf src
          mkdir src
          unzip -q app.zip -d src

          test -f src/project.yml || {
            echo "❌ app.zip 根目录缺少 project.yml"
            exit 1
          }

          echo "✅ 源码解压完成"

      - name: 4. 安装 XcodeGen
        run: |
          brew install xcodegen

      - name: 5. 生成 Xcode 工程
        working-directory: src
        run: |
          set -e
          xcodegen generate

          test -d CarIdle.xcodeproj || {
            echo "❌ CarIdle.xcodeproj 生成失败"
            exit 1
          }

          echo "✅ Xcode 工程生成成功"

      - name: 6. 编译主 App
        working-directory: src
        run: |
          set -e

          xcodebuild \
            -project CarIdle.xcodeproj \
            -scheme CarIdle \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 7. 检查并打包 IPA
        working-directory: src
        run: |
          set -e

          APP="build/Build/Products/Release-iphoneos/CarIdle.app"

          test -d "$APP" || {
            echo "❌ 没找到 CarIdle.app"
            exit 1
          }

          test -f "$APP/Info.plist" || {
            echo "❌ CarIdle.app 缺少 Info.plist"
            exit 1
          }

          echo "✅ CarIdle.app 编译成功"

          rm -rf Payload
          rm -f CarIdle-V2.0.9.ipa

          mkdir Payload
          cp -R "$APP" Payload/

          zip -qry CarIdle-V2.0.9.ipa Payload

          test -f CarIdle-V2.0.9.ipa || {
            echo "❌ IPA 打包失败"
            exit 1
          }

          echo "✅ CarIdle-V2.0.9.ipa 打包完成"

      - name: 8. 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarIdle-V2.0.9
          path: src/CarIdle-V2.0.9.ipa
          if-no-files-found: error
