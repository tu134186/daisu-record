name: 编译怠速记录

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 1. 读取仓库
        uses: actions/checkout@v4

      - name: 2. 检查 app.zip
        shell: bash
        run: |
          set -e

          if [ ! -f "app.zip" ]; then
            echo "❌ 根目录没有 app.zip"
            exit 1
          fi

          unzip -tq app.zip >/dev/null
          echo "✅ app.zip 正常"

      - name: 3. 解压源码
        shell: bash
        run: |
          set -e

          rm -rf src
          mkdir src

          unzip -q app.zip -d src

          if [ ! -f "src/project.yml" ]; then
            echo "❌ app.zip 根目录没有 project.yml"
            find src -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "✅ 源码结构正常"

      - name: 4. 读取源码版本
        shell: bash
        run: |
          set -e

          VERSION=$(grep 'MARKETING_VERSION:' src/project.yml \
            | head -1 \
            | sed 's/.*MARKETING_VERSION:[[:space:]]*//' \
            | tr -d '"')

          BUILD=$(grep 'CURRENT_PROJECT_VERSION:' src/project.yml \
            | head -1 \
            | sed 's/.*CURRENT_PROJECT_VERSION:[[:space:]]*//' \
            | tr -d '"')

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

          echo "=========================="
          echo "源码版本：V$VERSION"
          echo "源码 Build：$BUILD"
          echo "=========================="

      - name: 5. 安装 XcodeGen
        shell: bash
        run: |
          set -e

          brew install xcodegen
          xcodegen --version

      - name: 6. 生成工程
        working-directory: src
        shell: bash
        run: |
          set -e

          xcodegen generate

          if [ ! -d "CarIdle.xcodeproj" ]; then
            echo "❌ 工程生成失败"
            exit 1
          fi

          echo "✅ 工程生成成功"

      - name: 7. 编译 Release
        working-directory: src
        shell: bash
        run: |
          set -o pipefail

          rm -rf build
          mkdir -p build/Release-iphoneos

          xcodebuild \
            -project CarIdle.xcodeproj \
            -target CarIdle \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee ../xcodebuild.log

      - name: 8. 检查 App 和 Widget
        shell: bash
        run: |
          set -e

          APP="src/build/Release-iphoneos/CarIdle.app"
          WIDGET="$APP/PlugIns/CarIdleWidget.appex"

          if [ ! -d "$APP" ]; then
            echo "❌ 没找到 CarIdle.app"
            exit 1
          fi

          if [ ! -d "$WIDGET" ]; then
            echo "❌ 没找到 CarIdleWidget.appex"
            find "$APP" -maxdepth 4 -print
            exit 1
          fi

          echo "✅ App 存在"
          echo "✅ Widget 存在"

      - name: 9. 检查编译后的版本号
        shell: bash
        run: |
          set -e

          APP="src/build/Release-iphoneos/CarIdle.app"
          WIDGET="$APP/PlugIns/CarIdleWidget.appex"

          APP_VERSION=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$APP/Info.plist"
          )

          APP_BUILD=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleVersion' \
            "$APP/Info.plist"
          )

          WIDGET_VERSION=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$WIDGET/Info.plist"
          )

          WIDGET_BUILD=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleVersion' \
            "$WIDGET/Info.plist"
          )

          echo "源码：V$VERSION Build $BUILD"
          echo "App：V$APP_VERSION Build $APP_BUILD"
          echo "Widget：V$WIDGET_VERSION Build $WIDGET_BUILD"

          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "❌ App 版本错误"
            exit 1
          fi

          if [ "$APP_BUILD" != "$BUILD" ]; then
            echo "❌ App Build 错误"
            exit 1
          fi

          if [ "$WIDGET_VERSION" != "$VERSION" ]; then
            echo "❌ Widget 版本错误"
            exit 1
          fi

          if [ "$WIDGET_BUILD" != "$BUILD" ]; then
            echo "❌ Widget Build 错误"
            exit 1
          fi

          echo "✅ App / Widget 版本完全一致"

      - name: 10. 打包 IPA
        shell: bash
        run: |
          set -e

          APP="src/build/Release-iphoneos/CarIdle.app"

          rm -rf Payload output

          mkdir Payload
          mkdir output

          cp -R "$APP" Payload/

          zip -qry \
            "output/怠速记录-V${VERSION}.ipa" \
            Payload

          cp \
            "output/怠速记录-V${VERSION}.ipa" \
            "output/怠速记录.ipa"

          echo "✅ IPA 打包成功"

      - name: 11. 最终拆包检查 Widget
        shell: bash
        run: |
          set -e

          IPA="output/怠速记录-V${VERSION}.ipa"

          TMP=$(mktemp -d)

          unzip -q "$IPA" -d "$TMP"

          APP=$(find "$TMP/Payload" -maxdepth 1 -name "*.app" | head -1)

          WIDGET="$APP/PlugIns/CarIdleWidget.appex"

          if [ ! -d "$WIDGET" ]; then
            echo "❌ 最终 IPA 里面没有 Widget"
            exit 1
          fi

          FINAL_VERSION=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$WIDGET/Info.plist"
          )

          FINAL_BUILD=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleVersion' \
            "$WIDGET/Info.plist"
          )

          echo "=============================="
          echo "最终 IPA Widget"
          echo "Version：$FINAL_VERSION"
          echo "Build：$FINAL_BUILD"
          echo "=============================="

          if [ "$FINAL_VERSION" != "$VERSION" ]; then
            echo "❌ IPA 内 Widget 版本错误"
            exit 1
          fi

          if [ "$FINAL_BUILD" != "$BUILD" ]; then
            echo "❌ IPA 内 Widget Build 错误"
            exit 1
          fi

          echo "✅ 最终 IPA Widget 版本正确"

          rm -rf "$TMP"

      - name: 12. 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: 怠速记录-IPA-V${{ env.VERSION }}
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 13. 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 编译失败日志
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
