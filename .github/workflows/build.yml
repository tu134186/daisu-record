name: 编译怠速记录

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 1. 读取仓库
        uses: actions/checkout@v4

      - name: 2. 检查 app.zip
        shell: bash
        run: |
          set -e

          if [ ! -f "app.zip" ]; then
            echo "❌ 仓库根目录没有 app.zip"
            exit 1
          fi

          unzip -tq app.zip >/dev/null

          echo "✅ 找到 app.zip"
          echo "✅ ZIP 文件完整"

      - name: 3. 解压源码
        shell: bash
        run: |
          set -e

          rm -rf src
          mkdir -p src

          unzip -q app.zip -d src

          if [ ! -f "src/project.yml" ]; then
            echo "❌ app.zip 根目录没有 project.yml"
            echo "===== ZIP 内文件 ====="
            find src -maxdepth 3 -type f | head -80
            exit 1
          fi

          echo "✅ 源码结构正常"

      - name: 4. 安装 XcodeGen
        shell: bash
        run: |
          set -e

          brew install xcodegen
          xcodegen --version

          echo "✅ XcodeGen 安装完成"

      - name: 5. 生成 Xcode 工程
        working-directory: src
        shell: bash
        run: |
          set -e

          xcodegen generate

          if [ ! -d "CarIdle.xcodeproj" ]; then
            echo "❌ CarIdle.xcodeproj 生成失败"
            exit 1
          fi

          echo "✅ Xcode 工程生成成功"

      - name: 6. 编译 iPhone Release
        working-directory: src
        shell: bash
        run: |
          set -o pipefail

          rm -rf build
          mkdir -p build/Release-iphoneos

          xcodebuild \
            -project CarIdle.xcodeproj \
            -target CarIdle \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee ../xcodebuild.log

      - name: 7. 检查 App 和 Widget
        shell: bash
        run: |
          set -e

          APP="src/build/Release-iphoneos/CarIdle.app"
          WIDGET="$APP/PlugIns/CarIdleWidget.appex"

          if [ ! -d "$APP" ]; then
            echo "❌ 没找到 CarIdle.app"
            exit 1
          fi

          echo "✅ 主 App 编译成功"

          if [ ! -d "$WIDGET" ]; then
            echo "❌ 没找到 CarIdleWidget.appex"
            echo "===== CarIdle.app 内部结构 ====="
            find "$APP" -maxdepth 3 -print
            exit 1
          fi

          echo "✅ 找到 CarIdleWidget.appex"
          echo "✅ 主 App 与 Widget 均存在"

      - name: 8. 打包 IPA
        shell: bash
        run: |
          set -e

          APP_PATH="src/build/Release-iphoneos/CarIdle.app"

          VERSION=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$APP_PATH/Info.plist"
          )

          BUILD=$(
            /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleVersion' \
            "$APP_PATH/Info.plist"
          )

          echo "============================"
          echo "怠速记录 V${VERSION}"
          echo "Build ${BUILD}"
          echo "============================"

          rm -rf Payload
          rm -rf output

          mkdir -p Payload
          mkdir -p output

          cp -R "$APP_PATH" Payload/

          zip -qry \
            "output/怠速记录-V${VERSION}.ipa" \
            Payload

          cp \
            "output/怠速记录-V${VERSION}.ipa" \
            "output/怠速记录.ipa"

          echo "✅ IPA 打包完成"
          echo "版本：V${VERSION}"
          echo "Build：${BUILD}"

          ls -lh output

      - name: 9. 审计最终 IPA 内的 Widget 版本
        shell: bash
        run: |
          set -e

          IPA="$(ls output/怠速记录-V*.ipa | head -1)"

          echo "============================"
          echo "开始检查最终 IPA"
          echo "============================"

          bash src/tools/check-built-ipa.sh \
            "$IPA" \
            2.2.18 \
            48

          TMP="$(mktemp -d)"

          unzip -q "$IPA" -d "$TMP"

          APPEX="$(
            find "$TMP/Payload" \
            -path '*/PlugIns/CarIdleWidget.appex' \
            -type d \
            | head -1
          )"

          if [ -z "$APPEX" ]; then
            echo "❌ 最终 IPA 内没有 CarIdleWidget.appex"
            rm -rf "$TMP"
            exit 1
          fi

          echo ""
          echo "===== 最终 Widget Info.plist ====="

          echo -n "Bundle ID："
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$APPEX/Info.plist"

          echo -n "Version："
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$APPEX/Info.plist"

          echo -n "Build："
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleVersion' \
            "$APPEX/Info.plist"

          echo ""
          echo "===== 检查 Widget 可执行文件 ====="

          if strings "$APPEX/CarIdleWidget" \
            | grep -E 'WIDGET V2\.2\.18|BUILD 48'; then

            echo "✅ 找到 V2.2.18 / Build 48 标记"

          else

            echo "❌ 最终 Widget 可执行文件里"
            echo "❌ 找不到 V2.2.18 / Build 48 标记"
            echo "❌ 禁止发布这个 IPA"

            rm -rf "$TMP"
            exit 1

          fi

          echo ""
          echo "===== Widget SHA256 ====="

          shasum -a 256 \
            "$APPEX/CarIdleWidget"

          rm -rf "$TMP"

          echo ""
          echo "======================================"
          echo "✅ 最终 IPA Widget 审计通过"
          echo "✅ Widget = V2.2.18"
          echo "✅ Build = 48"
          echo "======================================"

      - name: 10. 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: 怠速记录-IPA
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 11. 上传编译失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 编译失败日志
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
